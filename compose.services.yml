services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?Set CLICKHOUSE_IMAGE in .env.local}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: ${TZ:?}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:?}:${CLICKHOUSE_HTTP_PORT:?}"
      - "${CLICKHOUSE_PORT:?}:${CLICKHOUSE_PORT:?}"
    volumes:
      - ./volume:/var/lib/clickhouse
      - ./infra/ports.xml:/etc/clickhouse-server/config.d/ports.xml:ro
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --host 127.0.0.1 --port "$${CLICKHOUSE_PORT}" --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 2s
      timeout: 5s
      retries: 60
    env_file: .env.local
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  app:
    image: abds-lab-app:local
    build:
      context: .
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:?}
        JAVA_IMAGE: ${JAVA_IMAGE:?}
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
    ports:
      - "${APP_PORT:?}:${APP_PORT:?}"
    volumes:
      - ./data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/energosbyt.jar", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
